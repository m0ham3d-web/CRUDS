<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS/Basic Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crud">
        <div class="head">
            <h2>CRUDS</h2>
            <P>Product management system</P>
        </div>
        <div class="inputs">
        <input type="text"  id="title" placeholder="title">
        <div class="price">
            <input type="number" placeholder="price" id ="price" onkeyup=" getTotal()">
            <input type="number" placeholder="taxes" id ="taxes" onkeyup=" getTotal()">
            <input type="number" placeholder="ads" id ="ads" onkeyup=" getTotal()">
            <input type="number" placeholder="discount" id ="discount" onkeyup=" getTotal()">
            <small id="total"></small>
        </div>
        <input type="number" id="count" placeholder="count">
        <input type="text" id="category"placeholder="category">
        <button id="submit">Create</button>
        </div>
        <div class="output">
            <div class="searchBlock">
                <input onkeyup="searchData(this.value)"type="text" id ="search" placeholder="search">
                <div class="btnSearch">
                    <button onclick ="getSearchMood(this.id)" id="searchTitle">Search By Title</button>
                    <button onclick ="getSearchMood(this.id)" id="searchCategory">Search By Category</button>
                </div>
            </div>
            <div id="deleteAll">

            </div>
            <table>
                <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Taxes</th>
                <th>Ads</th>
                <th>Discount</th>
                <th>Total</th>
                <th>Category</th>
                <th>Update</th>
                <th>Delete</th>
                </tr>

                <tbody id="tbody">

                </tbody>
            </table>
        </div>
    </div>
    <script src="logic.js"></script>
</body>
</html>
